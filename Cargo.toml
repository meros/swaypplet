[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
# A section's `new()` builds its GTK widgets; a `Default` that did the same
# would read as a plain value.
new_without_default = "allow"

[workspace.dependencies]
swaypplet-base = { path = "crates/base" }
swaypplet-tokens = { path = "crates/tokens" }
swaypplet-model = { path = "crates/model" }
swaypplet-ui = { path = "crates/ui" }
swaypplet-system = { path = "crates/system" }
swaypplet-audio = { path = "crates/audio" }
swaypplet-devices = { path = "crates/devices" }
swaypplet-notifyd = { path = "crates/notifyd" }
swaypplet-displays = { path = "crates/displays" }
swaypplet-cast = { path = "crates/cast" }
swaypplet-ambient = { path = "crates/ambient" }
swaypplet-jump = { path = "crates/jump" }
swaypplet-screenshot = { path = "crates/screenshot" }
swaypplet-fp = { path = "crates/fp" }
swaypplet-switch-user = { path = "crates/switch-user" }
swaypplet-auth-card = { path = "crates/auth-card" }
swaypplet-lock = { path = "crates/lock" }
swaypplet-greet = { path = "crates/greet" }
swaypplet-idle = { path = "crates/idle" }
swaypplet-polkit = { path = "crates/polkit" }
swaypplet-notifications = { path = "crates/notifications" }
swaypplet-widgets = { path = "crates/widgets" }
swaypplet-settings-kit = { path = "crates/settings-kit" }
swaypplet-launcher = { path = "crates/launcher" }
swaypplet-settings-alerts = { path = "crates/settings-alerts" }
swaypplet-settings-bar = { path = "crates/settings-bar" }
swaypplet-settings-displays = { path = "crates/settings-displays" }
swaypplet-settings-glass = { path = "crates/settings-glass" }
swaypplet-settings-idle = { path = "crates/settings-idle" }
swaypplet-settings-input = { path = "crates/settings-input" }
swaypplet-settings-launcher = { path = "crates/settings-launcher" }
swaypplet-settings-look = { path = "crates/settings-look" }
swaypplet-settings-quality = { path = "crates/settings-quality" }
swaypplet-settings-system = { path = "crates/settings-system" }
swaypplet-settings = { path = "crates/settings" }
swaypplet-bar = { path = "crates/bar" }
swaypplet-panel = { path = "crates/panel" }
swaypplet-osd = { path = "crates/osd" }
swaypplet-dmenu = { path = "crates/dmenu" }
swaypplet-label = { path = "crates/label" }
swaypplet-app = { path = "crates/app" }

gtk4 = { version = "0.11", features = ["v4_14"] }
gtk4-layer-shell = "0.8"
# v1_2 gates `Instance` and the typed `connect_monitor` binding; the linked
# gtk4-layer-shell C library must be >= 1.2 (nixpkgs ships 1.3).
gtk4-session-lock = { version = "0.4.0", features = ["v1_2"] }
pam = "0.8"
glib = "0.22"
gio = "0.22"
gdk4 = "0.11"
cairo-rs = "0.22"
zbus = { version = "4", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "io-util", "sync"] }
protobuf = "3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
greetd_ipc = { version = "0.10.3", features = ["sync-codec"] }
wayland-client = "0.31"
# Bindings for the protocols in crates/ui/protocols/ that no crate ships.
wayland-scanner = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
swayipc = "4"
system-tray = { version = "0.8", default-features = false, features = ["data"] }
gdk4-wayland = { version = "0.11", features = ["wayland_crate"] }
libpulse-binding = "2.30.1"
material-colors = { version = "0.4.2", default-features = false, features = ["std"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
gbm = { version = "0.18", default-features = false }
khronos-egl = { version = "6", features = ["static", "1_5"] }
glow = "0.18"
# The Cast channel to a TV (services::cast::channel). ring, not the default
# aws-lc-rs, which needs cmake and nasm to build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
protobuf-codegen = "3.7"
# A certificate for the fake Cast receiver the channel is tested against.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

# Symbols stay in a release build (the default strip removes debug info
# only), so a crash's frames have function names (crates/screenshot/src/quality/crash.rs).
# Line tables are left out: they cost 43 MB for swaypplet's own code.
[profile.release]
strip = "debuginfo"
# The pre-push hook's frame-gate build recompiles in seconds after an edit
# instead of 2.5 min. The Nix build turns it off (flake.nix): a sandbox
# has no earlier session to reuse.
incremental = true

# swaypplet's own crates at opt-level 1, its dependencies at the profile's
# level. LLVM spends about 130 of the crate's 155 s at opt-level 2; level 1
# builds it in 105 s. Measured 2026-10-01 with dev/frame-bench.sh, three
# runs each: late frames 3.3-4.3 % (level 1) against 3.3-5.2 % (level 2),
# p95 work 0.72-0.78 ms against 0.66-0.98 ms. Level 0 (23 s) had a run at
# 9.1 % late with a 19.6 ms frame, so it stays off.
[profile.release.package.swaypplet-base]
opt-level = 1
[profile.release.package.swaypplet-tokens]
opt-level = 1
[profile.release.package.swaypplet-model]
opt-level = 1
[profile.release.package.swaypplet-ui]
opt-level = 1
[profile.release.package.swaypplet-system]
opt-level = 1
[profile.release.package.swaypplet-audio]
opt-level = 1
[profile.release.package.swaypplet-devices]
opt-level = 1
[profile.release.package.swaypplet-notifyd]
opt-level = 1
[profile.release.package.swaypplet-displays]
opt-level = 1
[profile.release.package.swaypplet-cast]
opt-level = 1
[profile.release.package.swaypplet-ambient]
opt-level = 1
[profile.release.package.swaypplet-jump]
opt-level = 1
[profile.release.package.swaypplet-screenshot]
opt-level = 1
[profile.release.package.swaypplet-fp]
opt-level = 1
[profile.release.package.swaypplet-switch-user]
opt-level = 1
[profile.release.package.swaypplet-auth-card]
opt-level = 1
[profile.release.package.swaypplet-lock]
opt-level = 1
[profile.release.package.swaypplet-greet]
opt-level = 1
[profile.release.package.swaypplet-idle]
opt-level = 1
[profile.release.package.swaypplet-polkit]
opt-level = 1
[profile.release.package.swaypplet-notifications]
opt-level = 1
[profile.release.package.swaypplet-widgets]
opt-level = 1
[profile.release.package.swaypplet-settings-kit]
opt-level = 1
[profile.release.package.swaypplet-launcher]
opt-level = 1
[profile.release.package.swaypplet-settings-alerts]
opt-level = 1
[profile.release.package.swaypplet-settings-bar]
opt-level = 1
[profile.release.package.swaypplet-settings-displays]
opt-level = 1
[profile.release.package.swaypplet-settings-glass]
opt-level = 1
[profile.release.package.swaypplet-settings-idle]
opt-level = 1
[profile.release.package.swaypplet-settings-input]
opt-level = 1
[profile.release.package.swaypplet-settings-launcher]
opt-level = 1
[profile.release.package.swaypplet-settings-look]
opt-level = 1
[profile.release.package.swaypplet-settings-quality]
opt-level = 1
[profile.release.package.swaypplet-settings-system]
opt-level = 1
[profile.release.package.swaypplet-settings]
opt-level = 1
[profile.release.package.swaypplet-bar]
opt-level = 1
[profile.release.package.swaypplet-panel]
opt-level = 1
[profile.release.package.swaypplet-osd]
opt-level = 1
[profile.release.package.swaypplet-dmenu]
opt-level = 1
[profile.release.package.swaypplet-label]
opt-level = 1
[profile.release.package.swaypplet-app]
opt-level = 1
[profile.release.package.swaypplet]
opt-level = 1

[profile.dev]
opt-level = 0
debug = 1                # Line tables only: drastically cuts debuginfo emission & linker workload
split-debuginfo = "unpacked"
incremental = true

# Optimize dependencies slightly so GTK event dispatch remains fast without slowing crate compilation
[profile.dev.package."*"]
opt-level = 1
