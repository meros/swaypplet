[package]
name = "swaypplet"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# Phone-as-passkey auth (src/passkey/). Git-pinned: the crate is pre-1.0
# and its cable/hybrid API is the part we depend on most heavily, so a
# floating version would break the agent without warning. package.nix
# carries the matching cargoLock.outputHashes entry.
libwebauthn = { git = "https://github.com/linux-credentials/libwebauthn", rev = "5bd5f49cbf868b90e99edb5c0471949622992c79" }
qrcode = "0.14"
# libwebauthn's store trait is #[async_trait], so implementing it needs the
# same attribute on our side.
async-trait = "0.1"

gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
# v1_2 gates `Instance` and the typed `connect_monitor` binding; the linked
# gtk4-layer-shell C library must be >= 1.2 (nixpkgs ships 1.3).
gtk4-session-lock = { version = "0.4.0", features = ["v1_2"] }
pam = "0.8"
glib = "0.22"
gio = "0.22"
gdk4 = "0.11"
cairo-rs = "0.22"
zbus = { version = "4", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "io-util", "sync"] }
protobuf = "3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
greetd_ipc = { version = "0.10.3", features = ["sync-codec"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
swayipc = "4"
system-tray = { version = "0.8", default-features = false, features = ["data"] }
gdk4-wayland = { version = "0.11", features = ["wayland_crate"] }
libpulse-binding = "2.30.1"

[build-dependencies]
protobuf-codegen = "3.7"
