[package]
name = "swaypplet"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
gtk4-layer-shell = "0.4"
# 0.1.2 is the only release matching gtk4 0.9 / glib 0.20 (0.2+ need gtk4 0.10/0.11).
# The missing `monitor` signal binding is connected generically at runtime.
gtk4-session-lock = "0.1.2"
pam = "0.8"
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"
cairo-rs = "0.20"
zbus = { version = "4", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "io-util", "sync"] }
protobuf = "3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
greetd_ipc = { version = "0.10.3", features = ["sync-codec"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[build-dependencies]
protobuf-codegen = "3.7"
