[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
# A section's `new()` builds its GTK widgets; a `Default` that did the same
# would read as a plain value. The lint fires only because these
# constructors became `pub` when the code was split into crates.
new_without_default = "allow"

[workspace.dependencies]
swaypplet-core = { path = "crates/core" }
swaypplet-services = { path = "crates/services" }
swaypplet-jump = { path = "crates/jump" }
swaypplet-screenshot = { path = "crates/screenshot" }
swaypplet-lock = { path = "crates/lock" }
swaypplet-notifications = { path = "crates/notifications" }
swaypplet-widgets = { path = "crates/widgets" }
swaypplet-polkit = { path = "crates/polkit" }
swaypplet-settings = { path = "crates/settings" }
swaypplet-bar = { path = "crates/bar" }
swaypplet-app = { path = "crates/app" }

gtk4 = { version = "0.11", features = ["v4_14"] }
gtk4-layer-shell = "0.8"
# v1_2 gates `Instance` and the typed `connect_monitor` binding; the linked
# gtk4-layer-shell C library must be >= 1.2 (nixpkgs ships 1.3).
gtk4-session-lock = { version = "0.4.0", features = ["v1_2"] }
pam = "0.8"
glib = "0.22"
gio = "0.22"
gdk4 = "0.11"
cairo-rs = "0.22"
zbus = { version = "4", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "io-util", "sync"] }
protobuf = "3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
greetd_ipc = { version = "0.10.3", features = ["sync-codec"] }
wayland-client = "0.31"
# Bindings for the protocols in crates/core/protocols/ that no crate ships.
wayland-scanner = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
swayipc = "4"
system-tray = { version = "0.8", default-features = false, features = ["data"] }
gdk4-wayland = { version = "0.11", features = ["wayland_crate"] }
libpulse-binding = "2.30.1"
material-colors = { version = "0.4.2", default-features = false, features = ["std"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
gbm = { version = "0.18", default-features = false }
khronos-egl = { version = "6", features = ["static", "1_5"] }
glow = "0.18"
# The Cast channel to a TV (services::cast::channel). ring, not the default
# aws-lc-rs, which needs cmake and nasm to build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
protobuf-codegen = "3.7"
# A certificate for the fake Cast receiver the channel is tested against.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

# Symbols stay in a release build (the default strip removes debug info
# only), so a crash's frames have function names (crates/screenshot/src/quality/crash.rs).
# Line tables are left out: they cost 43 MB for swaypplet's own code.
[profile.release]
strip = "debuginfo"
# The pre-push hook's frame-gate build recompiles in seconds after an edit
# instead of 2.5 min. The Nix build turns it off (flake.nix): a sandbox
# has no earlier session to reuse.
incremental = true

# swaypplet's own crates at opt-level 1, its dependencies at the profile's
# level. LLVM spends about 130 of the crate's 155 s at opt-level 2; level 1
# builds it in 105 s. Measured 2026-10-01 with dev/frame-bench.sh, three
# runs each: late frames 3.3-4.3 % (level 1) against 3.3-5.2 % (level 2),
# p95 work 0.72-0.78 ms against 0.66-0.98 ms. Level 0 (23 s) had a run at
# 9.1 % late with a 19.6 ms frame, so it stays off.
[profile.release.package.swaypplet]
opt-level = 1
[profile.release.package.swaypplet-core]
opt-level = 1
[profile.release.package.swaypplet-services]
opt-level = 1
[profile.release.package.swaypplet-jump]
opt-level = 1
[profile.release.package.swaypplet-screenshot]
opt-level = 1
[profile.release.package.swaypplet-lock]
opt-level = 1
[profile.release.package.swaypplet-notifications]
opt-level = 1
[profile.release.package.swaypplet-widgets]
opt-level = 1
[profile.release.package.swaypplet-polkit]
opt-level = 1
[profile.release.package.swaypplet-settings]
opt-level = 1
[profile.release.package.swaypplet-bar]
opt-level = 1
[profile.release.package.swaypplet-app]
opt-level = 1

[profile.dev]
opt-level = 0
debug = 1                # Line tables only: drastically cuts debuginfo emission & linker workload
split-debuginfo = "unpacked"
incremental = true

# Optimize dependencies slightly so GTK event dispatch remains fast without slowing crate compilation
[profile.dev.package."*"]
opt-level = 1
