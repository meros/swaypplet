# Standalone so it never lands in the shipped binary: swaypplet's crane build
# sees this directory but cargo ignores a nested package, and the empty
# [workspace] stops it from trying to adopt swaypplet's manifest as its root.
[workspace]

[package]
name = "glass-demo"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
gdk4 = "0.11"
glib = "0.22"
gtk4-session-lock = { version = "0.4.0", features = ["v1_2"] }
glow = "0.16"
libloading = "0.8"

[profile.dev]
opt-level = 1
debug = 1
split-debuginfo = "unpacked"
incremental = true

[profile.dev.package."*"]
opt-level = 2
